  h+=`<div class="photos">${x.photos.map((p,i)=>`<figure><img src="${p}" alt="${x.name} 사진 ${x.caps[i]}" loading="lazy"><figcaption>${x.caps[i]}</figcaption><button class="save" data-img="${p}" data-name="인베뉴16편_${x.fn}_${i+1}.jpg" hidden>사진 저장</button></figure>`).join('')}</div><button class="saveall" hidden>사진 ${x.photos.length}장 모두 저장</button>`;
  for(const [lab,id,short] of x.blocks){
    h+=`<div class="block"><div class="label">${lab}</div><div class="text${short?' short':''}" data-k="${id}"></div><button class="copy" data-target="${id}">${lab.split(' ')[0]} 복사</button></div>`;
  }
  sec.innerHTML=h; root.appendChild(sec);
}
document.querySelectorAll('[data-k]').forEach(el=>el.textContent=T[el.dataset.k]);
document.querySelectorAll('button.copy').forEach(btn=>{
  const label=btn.textContent;
  btn.addEventListener('click',()=>{
    const t=T[btn.dataset.target];
    const ok=()=>{btn.textContent='✓ 복사됐어요';btn.classList.add('done');setTimeout(()=>{btn.textContent=label;btn.classList.remove('done')},1800)};
    const fallback=()=>{const el=btn.parentElement.querySelector('.text');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='선택됨 · 길게 눌러 복사';};
    try{navigator.clipboard.writeText(t).then(ok,fallback);}catch(e){fallback();}
  });
});
(async()=>{
  let dl=null; try{dl = window.claude ? await window.claude.use("downloads") : null;}catch(e){}
  const hint=document.getElementById('save-hint');
  if(!dl){hint.innerHTML='사진은 <b>길게 눌러</b> 저장하세요.';return;}
  hint.innerHTML='<b>[사진 저장]</b>이나 <b>[모두 저장]</b>을 누르면 저장 창이 떠요. 아이폰은 공유 화면에서 <b>"이미지 저장"</b>을 고르세요.';
  const save=async b=>{
    b.textContent='준비 중…';
    try{const blob=await (await fetch(b.dataset.img)).blob(); await dl.save({filename:b.dataset.name,data:blob}); b.textContent='✓ 저장됨'; b.classList.add('done'); return true;}
    catch(e){b.textContent=(e&&e.code==='declined')?'사진 저장':'다시 시도'; if(e&&(e.code==='unavailable'||e.code==='not_granted')){document.querySelectorAll('button.save,button.saveall').forEach(x=>x.hidden=true);hint.innerHTML='사진은 <b>길게 눌러</b> 저장하세요.';} return false;}
  };
  document.querySelectorAll('button.save').forEach(b=>{b.hidden=false;b.addEventListener('click',()=>save(b));});
  document.querySelectorAll('button.saveall').forEach(a=>{a.hidden=false;a.addEventListener('click',async()=>{
    const bs=[...a.previousElementSibling.querySelectorAll('button.save')]; a.textContent='저장 중…';
    for(const b of bs){ if(!b.classList.contains('done')){ if(!await save(b)) break; } }
    a.textContent= bs.every(b=>b.classList.contains('done'))?'✓ 모두 저장됨':'이어서 저장하기';
  });});
})();
</script>
